<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SmartWaste</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf8ef, #d8f0e2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            min-height: 600px;
            background: white;
            border-radius: 26px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.12);
        }

        /* LEFT PANEL */

        .welcome {
            background: linear-gradient(145deg, #126b3e, #1b9658);
            color: white;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 50px;
        }

        .welcome h1 {
            font-size: 40px;
            line-height: 1.15;
            margin-bottom: 18px;
        }

        .welcome p {
            color: #dff4e7;
            font-size: 16px;
            line-height: 1.7;
        }

        .icon {
            font-size: 80px;
            margin-top: 40px;
        }

        /* RIGHT PANEL */

        .form-area {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back {
            color: #16834b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .form-area h2 {
            color: #173b2a;
            font-size: 33px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718078;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #355444;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d4e3da;
            border-radius: 11px;
            background: #fbfdfc;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #16834b;
            box-shadow: 0 0 0 3px rgba(22, 131, 75, 0.12);
            background: white;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: #16834b;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        button:hover {
            background: #116d3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22, 131, 75, 0.22);
        }

        .login-text {
            text-align: center;
            margin-top: 24px;
            color: #718078;
            font-size: 14px;
        }

        .login-text a {
            color: #16834b;
            text-decoration: none;
            font-weight: 700;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            .container {
                grid-template-columns: 1fr;
            }

            .welcome {
                padding: 35px;
                min-height: 260px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .icon {
                display: none;
            }

            .form-area {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="welcome">

            <div class="logo">
                🌿 SmartWaste
            </div>

            <h1>
                Join the<br>
                Movement!
            </h1>

            <p>
                Create your account and become a part
                of a cleaner, greener and smarter
                community.
            </p>

            <div class="icon">
                🌱
            </div>

        </div>


        <!-- REGISTER FORM -->

        <div class="form-area">

            <a href="/login" class="back">
                ← Back to Login
            </a>

            <h2>
                Create Account
            </h2>

            <p class="subtitle">
                Register to start using SmartWaste.
            </p>


            <!-- BACKEND FORM — PRESERVED -->

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit">
                    Create Account →
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
